apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sp-app
  template:
    metadata:
      labels:
        app: sp-app
    spec:
      containers:
        - name: spring-boot-app
          image: 78
          ports:
            - containerPort: 8080